[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-timeline"
version = "0.1.0"
description = "Incident timeline and evidence collection for small teams"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ishaan Seal" }, { name = "Aishik Ghosh" }]
dependencies = ["tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
incident-timeline = "incident_timeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["incident_timeline*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
